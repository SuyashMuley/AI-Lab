[project]
name = "localagent"
version = "0.1.0"
description = "A local agent runtime: a bounded, observable, self-healing ReAct loop over local models and strict tools."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["llm", "agent", "react", "tool-calling", "ollama"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "Intended Audience :: Developers",
]
dependencies = [
    "pydantic>=2.7",
    "llmcli",
    "toolrouter",
]

# The sibling projects in this repo; the runtime builds on them rather than copying them.
[tool.uv.sources]
llmcli = { path = "../llm-cli", editable = true }
toolrouter = { path = "../tool-router", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: hits a real model; auto-skipped when Ollama or the model is unavailable"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]
